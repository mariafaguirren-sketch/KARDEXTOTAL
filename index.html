<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kardex Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Idea: papel contable verde con renglones, tinta azul marino y sello rojo; la tarjeta Kardex es el tablero de juego. */
:root{
  --paper:#e8f1e2; --card:#fbfdf8; --line:#bdd4b6; --ink:#10304a; --mute:#566e60; --accent:#0f5b8a; --stamp:#b3261e;
  --ok:#1b7a3d; --okbg:#d3eedb; --bad:#b3261e; --badbg:#f8d9d5; --fix:#8a5200; --fixbg:#fae6bd;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1a15; --card:#172420; --line:#2b4136; --ink:#d7e8f5; --mute:#93aa9d; --accent:#6cb8ea; --stamp:#ff8a80;
  --ok:#6fd08c; --okbg:#1c3a27; --bad:#ff8a80; --badbg:#442220; --fix:#f0b858; --fixbg:#3f3216; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f1a15; --card:#172420; --line:#2b4136; --ink:#d7e8f5; --mute:#93aa9d; --accent:#6cb8ea; --stamp:#ff8a80;
  --ok:#6fd08c; --okbg:#1c3a27; --bad:#ff8a80; --badbg:#442220; --fix:#f0b858; --fixbg:#3f3216; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:800}
h3{font-size:18px;font-weight:600}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.hud{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:600 14px var(--body);padding:7px 12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.pill[disabled]{opacity:.4;cursor:not-allowed}
.pill.on{background:var(--ink);color:var(--card)}
.pill.done::after{content:" ✓"}
.stats{display:flex;gap:16px;align-items:center;font-family:var(--mono);font-weight:600}
.xp b{font-size:22px}
.hearts{color:var(--stamp);letter-spacing:2px;font-size:20px}
.hearts .lost{opacity:.22}
.brand{font:800 18px var(--display);letter-spacing:.02em}
.hero{display:grid;gap:22px;margin:24px 0 20px}
.hero p{max-width:60ch;margin:10px 0 0;font-size:18px}
.stamp{display:inline-block;transform:rotate(-3deg);border:3px solid var(--stamp);color:var(--stamp);font:800 14px var(--display);letter-spacing:.14em;padding:3px 10px;text-transform:uppercase;margin-bottom:12px}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:16px 0}
.scen button{text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:14px;cursor:pointer;display:grid;gap:4px}
.scen button.on{background:var(--ink);color:var(--card)}
.scen small{font-family:var(--mono);opacity:.85}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.rules div{border-left:4px solid var(--accent);padding:2px 0 2px 12px}
.rules b{display:block;font-family:var(--display)}
label.nm{display:grid;gap:4px;max-width:340px;font-weight:600}
input.txt{font:inherit;padding:9px 11px;border:1.5px solid var(--ink);border-radius:4px;background:var(--card);color:var(--ink)}
.btn{font:600 16px var(--body);padding:11px 18px;border:1.5px solid var(--ink);border-radius:4px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
:root[data-theme="dark"] .btn{color:#06121b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#06121b}}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.pill:focus-visible,input:focus-visible,.scen button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.mission{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
.mission div{border:1.5px dashed var(--ink);border-radius:4px;padding:8px 10px;background:var(--card);font-size:14px}
.mission b{display:block;font-family:var(--mono);font-size:12px;color:var(--mute)}
.rule{margin:8px 0 14px;font-size:15px;color:var(--mute)}
.scroll{overflow-x:auto;border:1.5px solid var(--ink);border-radius:4px;background:var(--card)}
table.kx{border-collapse:collapse;width:100%;min-width:860px;font-family:var(--mono);font-size:14px}
.kx th,.kx td{border:1px solid var(--line);padding:3px 4px;text-align:center}
.kx th{background:var(--ink);color:var(--card);font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:6px 4px}
.kx th.g-sa{background:var(--stamp)}
.kx th.g-sd{background:var(--accent)}
:root[data-theme="dark"] .kx th{color:#06121b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kx th{color:#06121b}}
.kx td.txt{font-family:var(--body);text-align:left;padding:4px 8px;vertical-align:top;min-width:92px}
.kx tr.top td{border-top:2px solid var(--ink)}
.kx td.nil{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.kx td.given{color:var(--mute)}
.kx input{width:78px;font:500 14px var(--mono);text-align:right;padding:5px 6px;border:1.5px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
.kx input.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.kx input.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.kx input.fix{background:var(--fixbg);border-color:var(--fix);color:var(--fix)}
.fb{margin-top:16px;border-left:6px solid var(--accent);background:var(--card);padding:12px 16px;border-radius:0 4px 4px 0}
.fb.good{border-color:var(--ok)} .fb.warn{border-color:var(--bad)} .fb.help{border-color:var(--fix)}
.fb ol{margin:8px 0 0;padding-left:20px}
.fb li{margin:4px 0}
.stars{font-size:26px;color:var(--fix);letter-spacing:4px}
.q{margin:16px 0;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.q label{display:block;margin:6px 0;cursor:pointer}
.q input[type=number]{width:140px}
.res{width:100%;border-collapse:collapse;font-family:var(--mono);margin:12px 0}
.res th,.res td{border:1px solid var(--line);padding:8px 10px;text-align:right}
.res th:first-child,.res td:first-child{text-align:left;font-family:var(--body)}
.res th{background:var(--ink);color:var(--card)}
:root[data-theme="dark"] .res th{color:#06121b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .res th{color:#06121b}}
.big{font:800 clamp(28px,5vw,44px) var(--display);color:var(--stamp)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .35s ease-out}@keyframes in{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ====== MOTOR ====== */
const M=[
 {id:'fifo',name:'PEPS',long:'PEPS (FIFO): primeras en entrar, primeras en salir',rule:'Regla: las unidades que salen se costean con los lotes más antiguos primero. El saldo queda con los lotes más recientes.'},
 {id:'lifo',name:'UEPS',long:'UEPS (LIFO): últimas en entrar, primeras en salir',rule:'Regla: las unidades que salen se costean con los lotes más recientes primero. El saldo queda con los lotes más antiguos.'},
 {id:'avg',name:'Promedio',long:'Promedio ponderado',rule:'Regla: tras cada compra se calcula un nuevo costo promedio = saldo total $ ÷ saldo en unidades. Las ventas salen a ese promedio.'}
];
const SC=[
 {id:'bici',name:'Bici-Centro',item:'cascos de ciclismo',tag:'Los precios suben',price:20,date0:'01-nov',init:{q:100,u:10},
  ops:[{t:'buy',q:50,u:13,date:'05-nov'},{t:'sell',q:120,date:'12-nov'},{t:'buy',q:80,u:14,date:'20-nov'}]},
 {id:'pintura',name:'Ferretería El Tornillo',item:'tarros de pintura',tag:'Los precios suben',price:12,date0:'01-nov',init:{q:80,u:5},
  ops:[{t:'buy',q:40,u:8,date:'06-nov'},{t:'sell',q:90,date:'13-nov'},{t:'buy',q:50,u:9,date:'21-nov'}]},
 {id:'licua',name:'Electro-Cuenca',item:'licuadoras',tag:'Los precios bajan',price:25,date0:'01-nov',init:{q:120,u:15},
  ops:[{t:'buy',q:60,u:12,date:'04-nov'},{t:'sell',q:150,date:'11-nov'},{t:'buy',q:90,u:10,date:'19-nov'}]}
];
const $=n=>'$'+n.toFixed(2);
const u4=n=>Math.abs(n-Math.round(n*100)/100)<1e-9?n.toFixed(2):n.toFixed(4);
function build(m,sc){
  const lines=[],notes=[];let cv=0;
  const init={q:sc.init.q,u:sc.init.u,t:sc.init.q*sc.init.u};
  lines.push({op:0,i:0,n:1,date:sc.date0,detail:'Saldo inicial',en:null,sa:null,sd:init,initial:true});
  notes.push('Saldo inicial: '+init.q+' u × '+$(init.u)+' = '+$(init.t)+'. Ya viene anotado.');
  if(m==='avg'){
    let tq=init.q,tt=init.t;
    sc.ops.forEach((op,k)=>{
      const o=k+1;
      if(op.t==='buy'){
        const t=op.q*op.u,pt=tt;tq+=op.q;tt+=t;const a=tt/tq;
        lines.push({op:o,i:0,n:1,date:op.date,detail:'Compra '+(o===1?1:2),en:{q:op.q,u:op.u,t},sa:null,sd:{q:tq,u:a,t:tt}});
        notes.push('Compra: '+op.q+' × '+$(op.u)+' = '+$(t)+'. Nuevo promedio = ('+$(pt)+' + '+$(t)+') ÷ '+tq+' u = '+u4(a)+'. Saldo: '+tq+' u, '+$(tt)+'.');
      }else{
        const a=tt/tq,t=op.q*a,pq=tq,pt=tt;tq-=op.q;tt-=t;
        lines.push({op:o,i:0,n:1,date:op.date,detail:'Venta de '+op.q+' u',en:null,sa:{q:op.q,u:a,t},sd:{q:tq,u:tq?tt/tq:0,t:tt}});cv+=t;
        notes.push('Venta: sale al promedio vigente ('+$(pt)+' ÷ '+pq+' u = '+u4(a)+'). Costo de la venta = '+op.q+' × '+u4(a)+' = '+$(t)+'. Quedan '+tq+' u por '+$(tt)+'.');
      }
    });
    return {lines,notes,cv,inv:tt,invq:tq};
  }
  let layers=[{q:init.q,u:init.u}];
  sc.ops.forEach((op,k)=>{
    const o=k+1;
    if(op.t==='buy'){
      layers.push({q:op.q,u:op.u});
      const sd=layers.map(l=>({q:l.q,u:l.u,t:l.q*l.u})),t=op.q*op.u;
      sd.forEach((s,i)=>lines.push({op:o,i,n:sd.length,date:op.date,detail:'Compra '+(o===1?1:2),en:i===0?{q:op.q,u:op.u,t}:null,sa:null,sd:s}));
      notes.push('Compra: '+op.q+' × '+$(op.u)+' = '+$(t)+'. Se anota como un lote nuevo y los lotes anteriores se mantienen en el saldo, cada uno con su costo.');
    }else{
      let need=op.q;const segs=[];
      while(need>0){
        const idx=m==='fifo'?0:layers.length-1,l=layers[idx],take=Math.min(need,l.q);
        segs.push({q:take,u:l.u,t:take*l.u});l.q-=take;need-=take;if(l.q===0)layers.splice(idx,1);
      }
      const sd=layers.map(l=>({q:l.q,u:l.u,t:l.q*l.u})),n=Math.max(segs.length,sd.length),tot=segs.reduce((a,s)=>a+s.t,0);cv+=tot;
      for(let i=0;i<n;i++){const j=i-(n-sd.length);
        lines.push({op:o,i,n,date:op.date,detail:'Venta de '+op.q+' u',en:null,sa:segs[i]||null,sd:j>=0?sd[j]:null});}
      const quien=m==='fifo'?'los lotes más antiguos':'los lotes más recientes';
      notes.push('Venta de '+op.q+' u con '+m.toUpperCase().replace('FIFO','PEPS').replace('LIFO','UEPS')+': salen '+quien+' primero. Salen '+segs.map(s=>s.q+' u a '+$(s.u)).join(' y luego ')+'. Costo de la venta = '+$(tot)+'. Queda '+sd.map(s=>s.q+' u a '+$(s.u)).join(' y ')+'.');
    }
  });
  const last=layers.reduce((a,l)=>a+l.q*l.u,0);
  return {lines,notes,cv,inv:last,invq:layers.reduce((a,l)=>a+l.q,0)};
}
function fillable(m,ln,b,f){
  if(ln.initial) return false;
  if(b==='en') return f==='t';
  if(b==='sa') return !(m==='avg'&&f==='q');
  return true;
}
function parse(s){
  s=String(s).trim().replace(/\$/g,'').replace(/\s/g,'');if(!s) return null;
  if(s.includes(',')&&s.includes('.')){ s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,''); }
  else s=s.replace(',','.');
  const v=Number(s);return Number.isFinite(v)?v:null;
}
function close(f,a,b){const d=Math.abs(a-b);return f==='q'?d<1e-6:f==='u'?d<=0.0101:d<=0.5;}
function fmtExp(f,v){return f==='q'?String(v):f==='u'?u4(v):v.toFixed(2);}
if(typeof module!=='undefined'){module.exports={build,SC,M,parse,close};}
</script>
<script>
/* ====== JUEGO ====== */
let S={scen:0,name:'',cur:-1,unlocked:0,xp:0,lv:{},quiz:null},ENG={};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function startGame(){
  const sc=SC[S.scen];ENG={};M.forEach(m=>ENG[m.id]=build(m.id,sc));
  S.lv={};M.forEach(m=>S.lv[m.id]={cells:{},hearts:3,errChecks:0,done:false,revealed:false,stars:0,earned:0,msg:'',cls:''});
  S.xp=0;S.unlocked=0;S.cur=0;S.quiz=null;render();
}
function maxScore(){
  let c=0;M.forEach(m=>ENG[m.id].lines.forEach(ln=>['en','sa','sd'].forEach(b=>{if(ln[b])['q','u','t'].forEach(f=>{if(fillable(m.id,ln,b,f))c++;});})));
  return c*10+150+100;
}
function hud(){
  const L=S.cur>=0&&S.cur<3?S.lv[M[S.cur].id]:null;
  let h='<div class="hud"><div class="brand">KARDEX ARENA</div>';
  if(S.cur>=0){
    h+='<div class="pills">'+M.map((m,i)=>`<button class="pill ${S.cur===i?'on':''} ${S.lv[m.id].done?'done':''}" data-go="${i}" ${i>S.unlocked?'disabled':''}>Nivel ${i+1} · ${m.name}</button>`).join('')
      +`<button class="pill ${S.cur===3?'on':''} ${S.quiz&&S.quiz.done?'done':''}" data-go="3" ${S.unlocked<3?'disabled':''}>Jefe final</button></div>`;
    h+='<div class="stats">'+(L?`<span class="hearts" title="Corazones del nivel">${[0,1,2].map(i=>`<span class="${i<L.hearts?'':'lost'}">♥</span>`).join('')}</span>`:'')+`<span class="xp"><b>${S.xp}</b> XP</span></div>`;
  }
  return h+'</div>';
}
function render(){
  let h=hud();
  if(S.cur===-1) h+=startHTML();
  else if(S.cur<3) h+=levelHTML(S.cur);
  else if(S.cur===3) h+=quizHTML();
  else h+=finalHTML();
  app.innerHTML=h;
  window.claude?.hot?.snapshot&&0;
}
function startHTML(){
  return `<div class="hero"><div><span class="stamp">Contabilidad de inventarios</span><h1>Llena la tarjeta Kardex antes de que te corrija.</h1>
  <p>Un saldo inicial, dos compras y una venta. Tres métodos: PEPS, UEPS y Promedio ponderado. Tú completas la tarjeta, el juego revisa cada celda y te corrige con la explicación.</p></div></div>
  <div class="card"><h2>Elige tu misión</h2>
  <div class="scen">${SC.map((s,i)=>`<button data-sc="${i}" class="${S.scen===i?'on':''}"><b>${esc(s.name)}</b><span>${esc(s.item)} · ${s.tag}</span><small>Saldo inicial ${s.init.q} u × ${$(s.init.u)}</small></button>`).join('')}</div>
  <label class="nm">Tu nombre<input class="txt" id="nm" value="${esc(S.name)}" placeholder="Nombre del jugador" autocomplete="off"></label>
  <div class="rules"><div><b>+10 puntos</b>por cada celda correcta a la primera (+5 en el 2.º intento).</div><div><b>3 corazones</b>por nivel. Cada revisión con errores cuesta uno.</div><div><b>Estrellas</b>hasta 3 por nivel, más bono de XP si terminas sin ayuda.</div><div><b>Jefe final</b>comparas los tres métodos y cuadras los totales.</div></div>
  <div class="actions"><button class="btn" id="go">Empezar el juego</button></div></div>`;
}
function missionHTML(sc){
  const o=sc.ops;
  return `<div class="mission"><div><b>${sc.date0} · SALDO INICIAL</b>${sc.init.q} u × ${$(sc.init.u)} = ${$(sc.init.q*sc.init.u)}</div>`+
  o.map((p,i)=>`<div><b>${p.date} · ${p.t==='buy'?'COMPRA '+(i===0?1:2):'VENTA'}</b>${p.t==='buy'?`${p.q} u × ${$(p.u)} = ${$(p.q*p.u)}`:`${p.q} u a ${$(sc.price)} c/u`}</div>`).join('')+'</div>';
}
function tableHTML(mi){
  const m=M[mi],D=ENG[m.id],L=S.lv[m.id];
  let h='<div class="scroll"><table class="kx"><thead><tr><th rowspan="2">Fecha</th><th rowspan="2">Detalle</th><th colspan="3">Entradas</th><th colspan="3" class="g-sa">Salidas</th><th colspan="3" class="g-sd">Saldo</th></tr><tr>'+
   '<th>Cant.</th><th>C. unit.</th><th>C. total</th><th class="g-sa">Cant.</th><th class="g-sa">C. unit.</th><th class="g-sa">C. total</th><th class="g-sd">Cant.</th><th class="g-sd">C. unit.</th><th class="g-sd">C. total</th></tr></thead><tbody>';
  D.lines.forEach((ln,li)=>{
    h+=`<tr class="${ln.i===0?'top':''}">`;
    if(ln.i===0) h+=`<td class="txt" rowspan="${ln.n}">${ln.date}</td><td class="txt" rowspan="${ln.n}">${esc(ln.detail)}</td>`;
    ['en','sa','sd'].forEach(b=>['q','u','t'].forEach(f=>{
      const d=ln[b];if(!d){h+='<td class="nil"></td>';return;}
      if(!fillable(m.id,ln,b,f)){h+=`<td class="given">${f==='q'?d.q:f==='u'?d.u.toFixed(2):d.t.toFixed(2)}</td>`;return;}
      const k=li+b+f,c=L.cells[k]||{val:'',st:''},lock=c.st==='ok'||c.st==='fix'||L.done;
      h+=`<td><input id="c${k}" data-k="${k}" class="${c.st}" inputmode="decimal" autocomplete="off" value="${esc(c.val||'')}" ${lock?'readonly':''} aria-label="${b==='en'?'Entrada':b==='sa'?'Salida':'Saldo'} ${f==='q'?'cantidad':f==='u'?'costo unitario':'costo total'}, fila ${li+1}"></td>`;
    }));
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
function levelHTML(mi){
  const m=M[mi],L=S.lv[m.id],sc=SC[S.scen];
  let h=`<div class="card"><h2>Nivel ${mi+1} · ${m.long}</h2><p class="rule">${m.rule}</p>${missionHTML(sc)}`;
  h+=tableHTML(mi);
  if(L.msg) h+=`<div class="fb ${L.cls}" role="status">${L.msg}</div>`;
  h+='<div class="actions">';
  if(!L.done) h+='<button class="btn" id="chk">Revisar mi kardex</button><button class="btn alt" id="rev">Mostrar corrección</button>';
  else h+=`<button class="btn" id="next">${mi<2?'Siguiente nivel →':'Ir al jefe final →'}</button>`;
  return h+'</div></div>';
}
function notesHTML(mi){return '<ol>'+ENG[M[mi].id].notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ol>';}
function sync(){
  if(S.cur<0||S.cur>2) return;
  const L=S.lv[M[S.cur].id];
  app.querySelectorAll('input[data-k]').forEach(i=>{const c=L.cells[i.dataset.k]||(L.cells[i.dataset.k]={val:'',st:'',att:0});if(c.st!=='ok'&&c.st!=='fix')c.val=i.value;});
}
function allCells(mi,fn){
  const m=M[mi],D=ENG[m.id];
  D.lines.forEach((ln,li)=>['en','sa','sd'].forEach(b=>{if(!ln[b])return;['q','u','t'].forEach(f=>{if(fillable(m.id,ln,b,f))fn(li+b+f,ln,b,f);});}));
}
function check(){
  const mi=S.cur,L=S.lv[M[mi].id];sync();
  let wrong=0,empty=0,gain=0,bad=new Set();
  allCells(mi,(k,ln,b,f)=>{
    const c=L.cells[k]||(L.cells[k]={val:'',st:'',att:0});
    if(c.st==='ok'||c.st==='fix') return;
    const v=parse(c.val);
    if(!String(c.val).trim()){empty++;c.st='';return;}
    c.att++;
    if(v!==null&&close(f,v,ln[b][f])){c.st='ok';gain+=c.att===1?10:c.att===2?5:2;}
    else{c.st='bad';wrong++;bad.add(ln.op);}
  });
  S.xp+=gain;L.earned+=gain;
  if(wrong){
    L.hearts--;L.errChecks++;
    if(L.hearts<=0){revealAll(true);return;}
    const ns=ENG[M[mi].id].notes;
    L.cls='warn';
    L.msg=`<b>${wrong} ${wrong===1?'celda no cuadra':'celdas no cuadran'}.</b> Perdiste un corazón (te quedan ${L.hearts}). Pista de los movimientos con error:<ol>${[...bad].map(o=>`<li>${esc(ns[o].split(':')[0])}: ${o===0?'revisa el saldo':'mira la regla del método y recalcula'}.</li>`).join('')}</ol>Corrige las celdas rojas y vuelve a revisar. Ganaste +${gain} XP en las correctas.`;
  }else if(empty){
    L.cls='';L.msg=`Vas bien: las celdas llenas están correctas (+${gain} XP). Faltan ${empty} por llenar.`;
  }else finishLevel(mi,false,'');
  render();
}
function finishLevel(mi,revealed,pre){
  const L=S.lv[M[mi].id];L.done=true;L.revealed=revealed;
  L.stars=revealed?0:(L.errChecks===0?3:L.errChecks===1?2:1);
  const bonus=revealed?0:[0,20,35,50][L.stars];S.xp+=bonus;
  S.unlocked=Math.max(S.unlocked,mi+1);
  L.cls=revealed?'help':'good';
  L.msg=pre+(revealed?'<b>Nivel cerrado con corrección.</b> Sin estrellas esta vez; repásalo así:':`<div class="stars">${'★'.repeat(L.stars)}${'☆'.repeat(3-L.stars)}</div><b>¡Kardex correcto!</b> +${bonus} XP de bono. Así se resuelve:`)+notesHTML(mi)
   +`<p>Costo de ventas: <b>${$(ENG[M[mi].id].cv)}</b> · Inventario final: <b>${$(ENG[M[mi].id].inv)}</b> (${ENG[M[mi].id].invq} u)</p>`;
}
function revealAll(auto){
  const mi=S.cur,L=S.lv[M[mi].id];sync();
  allCells(mi,(k,ln,b,f)=>{const c=L.cells[k]||(L.cells[k]={val:'',st:'',att:0});if(c.st!=='ok'){c.val=fmtExp(f,ln[b][f]);c.st='fix';}});
  finishLevel(mi,true,auto?'Se acabaron tus corazones, pero aquí está la corrección. ':'');
  render();
}
function quizQs(){
  const sc=SC[S.scen],r=id=>ENG[id],ing=sc.ops.find(o=>o.t==='sell').q*sc.price;
  const best=(fn,hi)=>M.slice().sort((a,b)=>hi?fn(b)-fn(a):fn(a)-fn(b))[0].id;
  const cv=m=>r(m.id).cv;
  const total=sc.init.q*sc.init.u+sc.ops.filter(o=>o.t==='buy').reduce((a,o)=>a+o.q*o.u,0);
  return [
   {t:'choice',q:'¿Qué método da el MAYOR costo de ventas en esta misión?',a:best(cv,true),exp:M.map(m=>m.name+' '+$(r(m.id).cv)).join(' · ')},
   {t:'choice',q:'¿Qué método da la MAYOR utilidad bruta?',a:best(cv,false),exp:'Utilidad bruta = ventas '+$(ing)+' − costo de ventas. '+M.map(m=>m.name+' '+$(ing-r(m.id).cv)).join(' · ')},
   {t:'num',q:`¿Cuál es la utilidad bruta con Promedio ponderado? (ventas = ${$(ing)})`,a:ing-r('avg').cv,exp:$(ing)+' − '+$(r('avg').cv)+' = '+$(ing-r('avg').cv)},
   {t:'num',q:'¿Cuánto suman siempre el costo de ventas y el inventario final, con cualquier método?',a:total,exp:'Es el costo de la mercadería disponible: saldo inicial + compras = '+$(total)+'. Los tres métodos solo reparten ese total de forma distinta.'}
  ];
}
function quizHTML(){
  const qs=quizQs();if(!S.quiz)S.quiz={done:false,ans:{},pts:0,res:[]};const Q=S.quiz;
  let h=`<div class="card"><h2>Jefe final: compara los métodos</h2><p class="rule">Usa los resultados de tus tres kardex. Cada pregunta vale 25 XP.</p>`;
  qs.forEach((q,i)=>{
    h+=`<div class="q"><b>${i+1}. ${esc(q.q)}</b>`;
    if(q.t==='choice') h+=M.map(m=>`<label><input type="radio" name="q${i}" value="${m.id}" ${Q.ans[i]===m.id?'checked':''} ${Q.done?'disabled':''}> ${m.name}</label>`).join('');
    else h+=`<div><input class="txt" type="text" inputmode="decimal" id="n${i}" value="${esc(Q.ans[i]||'')}" ${Q.done?'readonly':''} aria-label="Respuesta ${i+1}"></div>`;
    if(Q.done){const ok=Q.res[i];h+=`<div class="fb ${ok?'good':'warn'}"><b>${ok?'Correcto.':'No era esa.'}</b> ${q.t==='choice'?'Respuesta: '+M.find(m=>m.id===q.a).name+'. ':'Respuesta: '+$(q.a)+'. '}${esc(q.exp)}</div>`;}
    h+='</div>';
  });
  h+=`<div class="actions">${Q.done?'<button class="btn" id="fin">Ver mi resultado →</button>':'<button class="btn" id="sub">Entregar respuestas</button>'}</div></div>`;
  return h;
}
function submitQuiz(){
  const qs=quizQs(),Q=S.quiz;
  qs.forEach((q,i)=>{
    if(q.t==='choice'){const r=app.querySelector(`input[name=q${i}]:checked`);Q.ans[i]=r?r.value:'';Q.res[i]=Q.ans[i]===q.a;}
    else{const v=document.getElementById('n'+i).value;Q.ans[i]=v;const p=parse(v);Q.res[i]=p!==null&&Math.abs(p-q.a)<=0.5;}
  });
  Q.pts=Q.res.filter(Boolean).length*25;S.xp+=Q.pts;Q.done=true;S.unlocked=4;render();
}
function finalHTML(){
  const sc=SC[S.scen],ing=sc.ops.find(o=>o.t==='sell').q*sc.price,mx=maxScore(),pct=Math.round(S.xp/mx*100);
  const title=pct>=85?'Maestro/a del Kardex':pct>=60?'Contador/a Pro':'Aprendiz de Kardex';
  const stars=M.reduce((a,m)=>a+S.lv[m.id].stars,0);
  return `<div class="card"><span class="stamp">Resultado</span><h2>${esc(S.name||'Jugador/a')}, quedaste como</h2><div class="big">${title}</div>
  <p><b>${S.xp}</b> XP de ${mx} posibles (${pct}%) · ${stars} de 9 estrellas en los niveles.</p>
  <table class="res"><thead><tr><th>Método</th><th>Costo de ventas</th><th>Utilidad bruta</th><th>Inventario final</th><th>Suma CV + Inv.</th></tr></thead><tbody>
  ${M.map(m=>{const r=ENG[m.id];return `<tr><td>${m.name}</td><td>${$(r.cv)}</td><td>${$(ing-r.cv)}</td><td>${$(r.inv)}</td><td>${$(r.cv+r.inv)}</td></tr>`;}).join('')}</tbody></table>
  <p class="rule">Ventas: ${sc.ops.find(o=>o.t==='sell').q} u × ${$(sc.price)} = ${$(ing)}. En una misión donde ${sc.tag.toLowerCase()}, el método cambia la utilidad aunque la mercadería sea la misma.</p>
  <div class="actions"><button class="btn" id="again">Jugar otra misión</button><button class="btn alt" id="retry">Repetir esta misión</button></div></div>`;
}
/* eventos */
app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.sc!==undefined){S.name=(document.getElementById('nm')||{}).value||S.name;S.scen=+t.dataset.sc;render();return;}
  if(t.dataset.go!==undefined){sync();S.cur=+t.dataset.go;render();return;}
  const id=t.id;
  if(id==='go'){S.name=document.getElementById('nm').value.trim();startGame();}
  else if(id==='chk')check();
  else if(id==='rev')revealAll(false);
  else if(id==='next'){S.cur=Math.min(S.cur+1,3);render();window.scrollTo(0,0);}
  else if(id==='sub')submitQuiz();
  else if(id==='fin'){S.cur=4;render();window.scrollTo(0,0);}
  else if(id==='again'){S.cur=-1;S.scen=(S.scen+1)%SC.length;render();}
  else if(id==='retry')startGame();
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.k){e.preventDefault();check();}});
render();
</script>
